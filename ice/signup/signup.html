<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Feed Sign Up</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: rgb(120, 96, 64);
        }
        #formContainer {
            margin: 50px;
            width: 400px;
            height: 700px;
            justify-self: center;
            border: 10px solid blue;
            border-radius: 30px;
            background-color: white;
            overflow: hidden;
        }
        #myForm {
            display: grid;
            grid-template-rows: 1fr 1fr 1fr 1fr 1fr 1fr 1fr 1fr;
            grid-template-columns: 1fr 1fr;
        }
        #myForm > label {
            padding: 10px;
        }
        #closeBtn {
            margin: 15px;
        }
        h3 {
            text-align: center;
            padding: 20px;
        }
        label[for="username"] {
            padding: 10px;
            grid-column: 1;
            grid-row: 1;
        }
        label[for="password"] {
            padding: 10px;
            grid-row: 2;
            grid-column: 1;
        }
        label[for="email"] {
            padding: 10px;
            grid-row: 3;
            grid-column: 1;
        }
        .gender + div {
            grid-row: 4;
            grid-column: 2;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            padding: 10px;
        }
        input[type="radio"] {
            margin: 0;
        }
        .jesusImg {
            width: 100%;
            margin-top: -55px;
            z-index: -1;
        }
        input[type="email"],
        input[type="password"],
        input[type="username"] {
            height: 20px;
            padding: 8px;
            margin: 8px;
        }
        section:has(#newsletter),
        section:has(#conditions) {
            grid-column: 1 / 3;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }
        .button {
            grid-column: 1/3;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #scriptures {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr 1fr;
            height: 100px;
            column-gap: 5px;
            margin-top: -25px;
        }
        .oldTestament {
            width: 100%;
            grid-column: 1/2;
        }
        .newTestament {
            width: 100%;
            grid-column: 2/3;
        }
        .bom {
            width: 100%;
            grid-column: 3/4;
        }
        .DandC {
            width: 100%;
            grid-column: 4/5;
        }
        .PoGP {
            width: 100%;
            grid-column: 5/6;
        }
    </style>
</head>

<body>
    <div id="formContainer">
        <button type="button" id="closeBtn">X</button>
        <img class="jesusImg" src="../signup/images/jesus_feeds_5000.jpeg" alt="Jesus feeding the 5000">
        <h3>Sign Up for Daily Scripture Feed</h3>
        <form id="myForm">
            <label for="username">User Name:</label>
            <input type="username" id="username" name="username" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label class="gender">Gender:</label>
            <div>
                <input type="radio" id="male" name="gender" value="male" required>
                <label for="male">Male</label>
                <input type="radio" id="female" name="gender" value="female" required>
                <label for="female">Female</label>
            </div>

            <section>
                <input type="checkbox" id="newsletter" name="newsletter">
                <label for="newsletter">Subscribe to newsletter</label>
            </section>

            <section>
                <input type="checkbox" id="conditions" name="conditions" required>
                <label for="conditions">I acknowledge the terms and conditions</label>
            </section>

            <section class="button">
                <button type="submit">Submit</button>
            </section>
        </form>
        <div id="scriptures">
            <img class="oldTestament" src="../signup/images/old_testament.webp" alt="old testament">
            <img class="newTestament" src="../signup/images/new_testament.webp" alt="new testament">
            <img class="bom" src="../signup/images/book_of_mormon.webp" alt="book of mormon">
            <img class="DandC" src="../signup/images/doctrine_and_covenants.webp" alt="doctrine and covenants">
            <img class="PoGP" src="../signup/images/pearl_of_great_price.webp" alt="pearl of great price">\
        </div>
    </div>

    <div id="output"></div>

    <script>
        // Here is some Javascript to start looking forward to wdd131
        document.getElementById("closeBtn").addEventListener("click", function () {
            document.getElementById("formContainer").style.display = "none";
         });
        const form = document.getElementById('myForm');
        const output = document.getElementById('output');

        form.addEventListener('submit', function (event) {
            event.preventDefault(); // Stop form from actually submitting

            const formData = new FormData(form);
            const entries = [];

            for (const [key, value] of formData.entries()) {
                if (key == "password") {
                    entries.push(`<strong>${key}</strong>: ${value} (you should probably encrypt the password)`);
                } else {
                    entries.push(`<strong>${key}</strong>: ${value}`);
                }
            }

            output.innerHTML = `
            <br>  
            <h3>Here is the data that would be sent to the server:</h3>
            <ul>
                ${entries.map(item => `<li>${item}</li>`).join('')}
            </ul>
            `;
                });
    </script>

</body>

</html>
